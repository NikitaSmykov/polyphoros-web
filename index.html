<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyphoros | AI-Native Biotech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ + ПЛАВНЫЙ СКРОЛЛ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; color: #111; background: #fff; line-height: 1.6; }
        
        /* АНИМАЦИИ */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes textFadeIn { 0% { opacity: 0; filter: blur(3px); transform: translateX(-10px); } 100% { opacity: 1; filter: blur(0); transform: translateX(0); } }
        @keyframes barExpand { 0% { width: 0; opacity: 0; } 100% { width: 40px; opacity: 1; } }

        /* ГЛАВНЫЙ ЭКРАН */
        .hero {
            position: relative; width: 100%; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
            background: linear-gradient(135deg, rgba(6, 26, 21, 0.95) 0%, rgba(18, 70, 59, 0.85) 100%), url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
        }

        /* ПАНЕЛЬ НАВИГАЦИИ */
        header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 25px 6%; display: flex; justify-content: space-between; align-items: center;
            z-index: 10; background: rgba(4, 15, 12, 0.4); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ЛОГОТИП POLYPHOROS */
        .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; color: #fff; }
        .logo-bars { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3)); }
        .bar-1 { width: 0; height: 12px; background: #134e40; animation: barExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.3s; } 
        .bar-2 { width: 0; height: 12px; background: #8e9496; animation: barExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.5s; } 
        .logo-text { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 400; letter-spacing: 0.5px; opacity: 0; animation: textFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* МЕНЮ */
        nav ul { display: flex; list-style: none; gap: 45px; }
        nav ul li a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; transition: opacity 0.3s; }
        nav ul li a:hover { opacity: 1; }

        /* ТЕКСТ НА ГЛАВНОМ ЭКРАНЕ */
        .hero-content { padding-left: 10%; max-width: 1000px; z-index: 2; margin-top: 40px; animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hero-content h1 { color: #ffffff; font-size: 88px; font-weight: 600; line-height: 1.05; letter-spacing: -2.5px; margin-bottom: 25px; text-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .hero-content p { color: #c4d9d4; font-size: 20px; font-weight: 300; line-height: 1.6; letter-spacing: 0.5px; max-width: 650px; }

        /* КНОПКА COOKIE */
        .cookie-btn {
            position: absolute; bottom: 40px; right: 6%;
            background: rgba(255, 255, 255, 0.1); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3); padding: 12px 24px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(5px);
        }
        .cookie-btn:hover { background: #fff; color: #134e40; }

        /* БАЗОВЫЕ СЕКЦИИ */
        .section-white { background: #ffffff; padding: 120px 10%; display: flex; gap: 100px; }
        .section-gray { background: #f7faf9; padding: 120px 10%; }
        
        .section-title { flex: 1; }
        .section-title h2 { font-size: 52px; font-weight: 600; color: #134e40; line-height: 1.1; letter-spacing: -1.5px; margin-bottom: 20px;}
        .section-body { flex: 1.5; padding-top: 10px; }
        .section-body p { font-size: 18px; color: #444; margin-bottom: 25px; font-weight: 300; }
        .section-body strong { font-weight: 600; color: #134e40; }
        
        .sub-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #2d8b76; margin-bottom: 20px; display: block; }

        /* КАРТОЧКИ СРАВНЕНИЯ КОНКУРЕНТОВ */
        .compare-row { display: flex; background: #fff; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); overflow: hidden; margin-bottom: 20px; border: 1px solid #eee; }
        .compare-bad { flex: 1; padding: 35px; border-right: 1px solid #eee; background: #fdfdfd; }
        .compare-good { flex: 1; padding: 35px; background: #f2f7f5; border-left: 4px solid #134e40; }
        .compare-label-bad { color: #8e9496; text-transform: uppercase; font-size: 11px; font-weight: 700; margin-bottom: 15px; letter-spacing: 1.5px; }
        .compare-label-good { color: #2d8b76; text-transform: uppercase; font-size: 11px; font-weight: 700; margin-bottom: 15px; letter-spacing: 1.5px; }
        .compare-row h3 { font-size: 22px; margin-bottom: 12px; }
        .compare-bad h3 { color: #555; }
        .compare-good h3 { color: #134e40; }
        .compare-row p { font-size: 15px; line-height: 1.6; }
        .compare-bad p { color: #777; }
        .compare-good p { color: #222; }

        /* КАРТОЧКИ Q.E.D. ENGINE */
        .grid-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 60px; }
        .card { background: #fff; padding: 40px; border-top: 4px solid #134e40; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card h3 { font-size: 20px; color: #134e40; margin-bottom: 15px; }
        .card p { font-size: 15px; color: #555; }

        /* ТАБЛИЦА ПАЙПЛАЙНА */
        .pipeline-table { width: 100%; border-collapse: collapse; margin-top: 50px; background: #fff; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        .pipeline-table th, .pipeline-table td { padding: 25px; text-align: left; border-bottom: 1px solid #eee; }
        .pipeline-table th { background: #134e40; color: #fff; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .pipeline-table tr:hover { background: #f4f7f6; }
        .status-badge { background: #e0f2ed; color: #134e40; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 2px; white-space: nowrap; }
